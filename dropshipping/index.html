<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trending Products</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #fff;
    }
    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      height: 150px;
      width: auto;
    }
    .banner {
      width: 250px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #888;
      font-size: 24px;
    }
    .main {
      display: flex;
    }
    .categories {
      background-color: #1a1a1a;
      width: 200px;
      padding: 20px;
    }
    .category {
      margin-bottom: 15px;
      cursor: pointer;
      color: #ccc;
    }
    .category:hover {
      color: #fff;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      font-size: larger;
    }

  </style>
</head>
<body>
  <header>
   <img src="banner.png" alt="Trending Products Banner" style="width: 100%; height: 300px; object-fit: cover;" /> 
  </header>
  <img src="logo.jpg" alt="Your Logo" class="logo" /> 
    <h1>Trending Products</h1> 
  <div class="main">
    <div class="categories">
        <a href="electronices.html"><div class="category">Electronics</div></a>
      <div class="category">Fashion</div>
      <div class="category">Home & Kitchen</div>
      <div class="category">Fitness</div>
      <div class="category">Toys & Gadgets</div>
    </div>
    <div class="content">
      <h2>Welcome to Our Store!</h2>
      <p>Select a category to explore trending products.</p>
    </div>
  </div>
</body>
</html>
